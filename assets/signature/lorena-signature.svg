<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1056 598" role="img" aria-label="Lorena Maruch">
  <!-- Lorena Maruch: signature writing kit. How to animate it: README.md in this folder.
       .ink        the artwork (filled outline), visible only where the mask is white.
       .pen        hand-traced centre lines, one per pen stroke, in writing order:
                   1 = L: hook, top loop, diagonal, left loop, baseline, end hook.
                   2 = M: from the shared hook over the bowl, down into the bottom loop,
                       up to the peak, down, back up, swash.
                   Write them with stroke-dashoffset. Undashed, they reveal the whole artwork.
       .pen-guard  black patches that keep a wide pen from showing ink of a stroke that
                   crosses it before that stroke is written.
                   Without data-release: static, painted between pen 1 and pen 2.
                   With data-release: hidden by default; a script shows each one while
                   pen data-pen has drawn less than data-release units of its length.
       Inlining this SVG twice on one page? Give each copy its own mask id. -->
