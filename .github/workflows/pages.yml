name: Deploy to GitHub Pages

# Live site = www.lorenamaruch.com. Work-in-progress pushes to the working branch do NOT
# deploy; a reviewed version is published by running this workflow manually
# (Actions -> Deploy to GitHub Pages -> Run workflow), or by pushing to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Wrap site                       # site.html -> index.html (Pages skeleton + fragment)
        run: bash scripts/wrap-site.sh

      # Publish only the public site files (raw sources and docs stay out; site.html is never published)
      - name: Assemble site
        run: |
          mkdir -p _site
          for p in index.html 404.html CNAME robots.txt sitemap.xml favicon.ico favicon.svg css js assets data lab; do
            if [ -e "$p" ]; then cp -R "$p" _site/; fi
          done
          test ! -e _site/site.html
          head -c 15 _site/index.html | grep -qi '^<!doctype html>'
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
