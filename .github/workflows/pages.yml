name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/upbeat-dirac-mij6ct]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the public site files (raw sources and docs stay out)
      - name: Assemble site
        run: |
          mkdir -p _site
          for p in index.html 404.html CNAME robots.txt sitemap.xml favicon.ico favicon.svg css js assets data lab; do
            if [ -e "$p" ]; then cp -R "$p" _site/; fi
          done
          ls -la _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
